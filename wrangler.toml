name = "little-world"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# Giữ lại các biến/secret đã nhập trong dashboard khi deploy (nếu không, mỗi lần deploy có thể xoá mất)
keep_vars = true

# Giao diện (file tĩnh)
[assets]
directory = "./public"
binding = "ASSETS"

# Database D1 — không cần điền database_id: lần deploy đầu wrangler (>= 4.45) tự tạo database
# "little-world-db" và gắn vào biến DB. Bảng được tự tạo ở lần truy cập đầu tiên.
[[d1_databases]]
binding = "DB"
database_name = "little-world-db"

# (Tuỳ chọn) R2 để lưu video/nhạc và ảnh chất lượng cao — cần bật R2 (có nhập thẻ).
# Bỏ comment sau khi tạo bucket:
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "our-little-world-media"
